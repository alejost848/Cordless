name: Build Cordless

on:
  push:
    branches: [vita-daily, main]
    tags: ['v*']
  pull_request:
    branches: [vita-daily, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure build tools (rsync, zip)
        run: |
          if ! command -v rsync >/dev/null || ! command -v zip >/dev/null; then
            apt-get update && apt-get install -y --no-install-recommends rsync zip
          fi

      - name: Build background voice plugins
        run: bash scripts/build_plugin.sh

      - name: Build cordless.vpk (with bundled plugins)
        run: bash scripts/build.sh

      - name: Package plugins zip
        run: |
          zip -j cordless-plugins.zip \
            cordless_mem.skprx \
            cordless_voice_poc.suprx \
            cordless_voice_core.suprx \
            cordless_hud.suprx

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cordless-vita
          path: |
            cordless.vpk
            cordless-plugins.zip

      - name: Create GitHub Release on v* tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cordless.vpk
            cordless-plugins.zip
