name: Build Cordless

on:
  push:
    branches: [vita-daily, main]
    tags: ['v*']
  pull_request:
    branches: [vita-daily, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake make rsync zip curl tar bzip2 xz-utils

      - name: Install VitaSDK & portlibs
        run: |
          sudo mkdir -p /usr/local/vitasdk
          sudo chown "$USER:$USER" /usr/local/vitasdk
          export VITASDK=/usr/local/vitasdk
          export PATH="$VITASDK/bin:$PATH"
          curl -fsSL https://github.com/vitasdk/vdpm/releases/latest/download/bootstrap-vitasdk.sh | bash
          vdpm jansson opus libvita2d freetype libpng libjpeg-turbo libwebp bzip2 zlib pthread-embedded
          echo "VITASDK=/usr/local/vitasdk" >> "$GITHUB_ENV"
          echo "/usr/local/vitasdk/bin" >> "$GITHUB_PATH"

      - name: Build background voice plugins
        run: bash scripts/build_plugin.sh

      - name: Build cordless.vpk (with bundled plugins)
        run: bash scripts/build.sh

      - name: Package plugins zip
        run: |
          zip -j cordless-plugins.zip \
            cordless_mem.skprx \
            cordless_voice_poc.suprx \
            cordless_voice_core.suprx \
            cordless_hud.suprx

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cordless-vita
          path: |
            cordless.vpk
            cordless-plugins.zip

      - name: Create GitHub Release on v* tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cordless.vpk
            cordless-plugins.zip
