name: Build Cordless

on:
  push:
    branches: [vita-daily, main]
    tags: ['v*']
  pull_request:
    branches: [vita-daily, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake make rsync zip curl tar bzip2 xz-utils

      - name: Install VitaSDK & portlibs
        run: |
          export VITASDK="${{ runner.temp }}/vitasdk"
          export PATH="$VITASDK/bin:$PATH"
          curl -fsSL https://github.com/vitasdk/vdpm/releases/latest/download/bootstrap-vitasdk.sh | bash -s -- --install-dir "$VITASDK"
          # Pin [vita] to a verified complete 2026.08 snapshot (avoids incomplete daily snapshots)
          sed -i 's|Server = https://github.com/vitasdk/vitasdk-autobuild/releases/download/.*|Server = https://github.com/vitasdk/vitasdk-autobuild/releases/download/packages-2026.08-snapshot-20261115.68.1|' "$VITASDK/etc/pacman.conf"
          VDPM_NONINTERACTIVE=1 vdpm pacman -- -Syy --noconfirm --noscriptlet
          VDPM_NONINTERACTIVE=1 vdpm pacman -- -S --noconfirm --needed --noscriptlet jansson opus libvita2d freetype libpng libjpeg-turbo libwebp bzip2 zlib
          echo "VITASDK=$VITASDK" >> "$GITHUB_ENV"
          echo "$VITASDK/bin" >> "$GITHUB_PATH"

      - name: Build background voice plugins
        run: bash scripts/build_plugin.sh

      - name: Diagnose ELF relocation 25 on failure
        if: failure()
        run: |
          ELF="$HOME/.cache/cordless_plugin_build/build/cordless_voice_full"
          echo "=== flags.make ==="
          cat "$HOME/.cache/cordless_plugin_build/build/CMakeFiles/cordless_voice_full.dir/flags.make" || true
          echo "=== link.txt ==="
          cat "$HOME/.cache/cordless_plugin_build/build/CMakeFiles/cordless_voice_full.dir/link.txt" || true
          echo "=== reloc 25 / R_ARM_BASE_PREL in ELF ==="
          "$VITASDK/bin/arm-vita-eabi-readelf" -r "$ELF" | grep -B3 -A3 -E "R_ARM_BASE_PREL|R_ARM_GOT|Relocation section" | grep -B2 -A4 -E "R_ARM_BASE_PREL|R_ARM_GOT" | head -n 80 || true
          echo "=== all reloc types in ELF ==="
          "$VITASDK/bin/arm-vita-eabi-readelf" -r "$ELF" | awk '/R_ARM_/ {print $3}' | sort -u || true
          echo "=== scan VITASDK libs for BASE_PREL ==="
          find "$VITASDK/arm-vita-eabi" "$VITASDK/lib/gcc" -name "*.a" -o -name "*.o" | while read f; do
            if "$VITASDK/bin/arm-vita-eabi-readelf" -r "$f" 2>/dev/null | grep -q "R_ARM_BASE_PREL"; then
              echo "FOUND in $f"
              "$VITASDK/bin/arm-vita-eabi-readelf" -r "$f" 2>/dev/null | grep -B2 -E "R_ARM_BASE_PREL|File:" | head -n 20
            fi
          done
          echo "=== test cordless.vpk build ==="
          bash scripts/build.sh || true

      - name: Build cordless.vpk (with bundled plugins)
        run: bash scripts/build.sh

      - name: Package plugins zip
        run: |
          zip -j cordless-plugins.zip \
            cordless_mem.skprx \
            cordless_voice_poc.suprx \
            cordless_voice_core.suprx \
            cordless_hud.suprx

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cordless-vita
          path: |
            cordless.vpk
            cordless-plugins.zip

      - name: Create GitHub Release on v* tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cordless.vpk
            cordless-plugins.zip
