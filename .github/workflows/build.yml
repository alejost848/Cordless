name: Build Cordless

on:
  push:
    branches: [vita-daily, main]
    tags: ['v*']
  pull_request:
    branches: [vita-daily, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake make rsync zip curl tar bzip2 xz-utils

      - name: Install VitaSDK & portlibs
        run: |
          export VITASDK="${{ runner.temp }}/vitasdk"
          export PATH="$VITASDK/bin:$PATH"
          curl -fsSL https://github.com/vitasdk/vdpm/releases/latest/download/bootstrap-vitasdk.sh | bash -s -- --install-dir "$VITASDK"
          # Pin [vita] to a verified complete 2026.08 snapshot (avoids incomplete daily snapshots)
          sed -i 's|Server = https://github.com/vitasdk/vitasdk-autobuild/releases/download/.*|Server = https://github.com/vitasdk/vitasdk-autobuild/releases/download/packages-2026.08-snapshot-20261115.68.1|' "$VITASDK/etc/pacman.conf"
          VDPM_NONINTERACTIVE=1 vdpm pacman -- -Syy --noconfirm --noscriptlet
          VDPM_NONINTERACTIVE=1 vdpm pacman -- -S --noconfirm --needed --noscriptlet jansson opus libvita2d freetype libpng libjpeg-turbo libwebp bzip2 zlib
          echo "VITASDK=$VITASDK" >> "$GITHUB_ENV"
          echo "$VITASDK/bin" >> "$GITHUB_PATH"

      - name: Rebuild libjansson without PIC (upstream jansson 2.15.1 sets -fPIC)
        run: |
          curl -fsSL https://github.com/akheron/jansson/releases/download/v2.15.1/jansson-2.15.1.tar.gz -o /tmp/jansson.tar.gz
          tar -xzf /tmp/jansson.tar.gz -C /tmp
          sed -i 's/POSITION_INDEPENDENT_CODE true/POSITION_INDEPENDENT_CODE false/' /tmp/jansson-2.15.1/CMakeLists.txt
          cmake -S /tmp/jansson-2.15.1 -B /tmp/jansson-build \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DCMAKE_INSTALL_PREFIX="$VITASDK/arm-vita-eabi" \
            -DJANSSON_BUILD_DOCS=OFF \
            -DJANSSON_EXAMPLES=OFF \
            -DJANSSON_WITHOUT_TESTS=ON
          cmake --build /tmp/jansson-build -j"$(nproc)"
          cmake --install /tmp/jansson-build
          rm -rf /tmp/jansson.tar.gz /tmp/jansson-2.15.1 /tmp/jansson-build

      - name: Build background voice plugins
        run: bash scripts/build_plugin.sh

      - name: Build cordless.vpk (with bundled plugins)
        run: bash scripts/build.sh

      - name: Package plugins zip
        run: |
          zip -j cordless-plugins.zip \
            cordless_mem.skprx \
            cordless_voice_poc.suprx \
            cordless_voice_core.suprx \
            cordless_hud.suprx

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cordless-vita
          path: |
            cordless.vpk
            cordless-plugins.zip

      - name: Create GitHub Release on v* tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            > **Experimental release:** Voice calls and the optional background voice / in-game overlay (`L + R + TRIANGLE`) plugins are experimental. Back up `ur0:tai/config.txt` if customizing plugins manually (the built-in **Settings -> Background Voice** installer automatically saves `ur0:tai/config.txt.cordless.bak`).

            - `cordless.vpk` bundles the 4 optional plugin modules (`Settings -> Background Voice` to install/update/uninstall from inside the app).
            - `cordless-plugins.zip` provides the standalone plugin binaries (`cordless_mem.skprx`, `cordless_voice_poc.suprx`, `cordless_voice_core.suprx`, `cordless_hud.suprx`).
          files: |
            cordless.vpk
            cordless-plugins.zip
